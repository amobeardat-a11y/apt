services:
  - type: web
    name: apti-backend
    env: python
    plan: free
    region: singapore
    buildCommand: "pip install -r requirements.txt && python -m alembic upgrade head"
    startCommand: "python run.py"
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: BACKEND_CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:5500,http://127.0.0.1:5500"
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
      - key: FIRST_SUPERUSER_EMAIL
        value: admin@apti.vn
      - key: FIRST_SUPERUSER_PASSWORD
        value: Apti@2026Admin!

